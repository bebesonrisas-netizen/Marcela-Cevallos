name: Finova beta static checks
on:
  push:
    branches: [feature/finova-safe-foundations-20261021]
  pull_request:
    branches: [main]
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-html.mjs
